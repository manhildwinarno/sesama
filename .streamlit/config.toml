[theme]
base = "light"
font = "Inter"
baseRadius = "12px"
buttonRadius = "full"
headingFontSizes = ["32px", "24px", "20px", "18px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]

primaryColor = "#20211F"
backgroundColor = "#F8F9F6"
secondaryBackgroundColor = "#F0F1EE"
textColor = "#242522"
borderColor = "#E5E7E0"
showSidebarBorder = false

[theme.sidebar]
backgroundColor = "#F8F9F4"
secondaryBackgroundColor = "#EDEFE8"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/InterVariable.woff2"
weight = "100 900"

[server]
enableStaticServing = true
