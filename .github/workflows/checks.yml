name: Linux checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python tests/test_app.py
      - run: python tests/test_camera.py
      - run: python tests/test_cloud_frames.py
      - run: python tests/test_http_middleware.py
      - run: python tests/test_benchmark.py
      - run: python tests/test_evaluation_data.py
      - run: node tests/check_audio.cjs
      - run: node tests/check_overlay.cjs
